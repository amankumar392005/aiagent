services:
  # ─── Redis ───
  - type: redis
    name: aiagent-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ─── API Gateway ───
  - type: web
    name: gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/gateway/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8000
      - key: REDIS_URL
        fromService:
          name: aiagent-redis
          type: redis
          property: connectionString
      - key: AUTH_SERVICE_URL
        fromService:
          name: auth
          type: web
          property: hostport
      - key: RESUME_SERVICE_URL
        fromService:
          name: resume
          type: web
          property: hostport
      - key: INTERVIEW_SERVICE_URL
        fromService:
          name: interview
          type: web
          property: hostport
      - key: ROADMAP_SERVICE_URL
        fromService:
          name: roadmap
          type: web
          property: hostport
      - key: BILLING_SERVICE_URL
        fromService:
          name: billing
          type: web
          property: hostport
      - key: FRONTEND_URL
        sync: false

  # ─── Auth Service ───
  - type: web
    name: auth
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/auth/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8001
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: aiagent-redis
          type: redis
          property: connectionString

  # ─── Resume Service ───
  - type: web
    name: resume
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/resume/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8002
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: aiagent-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  # ─── Interview Service ───
  - type: web
    name: interview
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/interview/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8003
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: aiagent-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  # ─── Roadmap Service ───
  - type: web
    name: roadmap
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/roadmap/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8004
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: aiagent-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  # ─── Billing Service ───
  - type: web
    name: billing
    runtime: docker
    plan: free
    dockerfilePath: ./backend/services/billing/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8005
      - key: MONGODB_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ─── Frontend ───
  - type: web
    name: frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_FIREBASE_APIKEY
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_BACKEND_URL
        sync: false
